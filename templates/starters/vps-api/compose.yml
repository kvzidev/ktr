services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ktr
      POSTGRES_PASSWORD: ktr
      POSTGRES_DB: ktr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  postgres_data: {}
